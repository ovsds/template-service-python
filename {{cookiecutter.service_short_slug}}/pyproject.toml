{%- set py_minor = '3.14' if cookiecutter.with_aiogram_utils == 'true' else '3.15' -%}
[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.5.0"]

[project]
authors = [{ email = "github@ovsds.ru", name = "ovsds" }]
dependencies = [
{%- if cookiecutter.with_aiogram_utils == "true" %}
  "aiogram (>=3.31.0,<4.0.0)",
{%- endif %}
{%- if cookiecutter.with_aiohttp_utils == "true" %}
  "aiohttp (>=3.14.5,<4.0.0)",
{%- endif %}
{%- if cookiecutter.with_json_utils == "true" %}
  "orjson (>=3.13.0,<4.0.0)",
{%- endif %}
  "pydantic (>=2.13.5,<3.0.0)",
  "pydantic-settings[yaml] (>=2.16.0,<3.0.0)",
]
description = "{{cookiecutter.service_name}}"
name = "{{cookiecutter.service_slug}}"
requires-python = ">={{ py_minor }},<{{ py_minor[:2] }}{{ py_minor[2:]|int + 1 }}"
version = "0.0.1"

[tool.black]
line-length = 120
target-version = ["py{{ py_minor|replace('.', '') }}"]

[tool.coverage.report]
exclude_lines = [
  "@(abc\\.)?abstractmethod",
  "class .*Protocol\\):",
  "def __repr__",
  "if __name__ == .__main__.:",
  "if typing.TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.coverage.run]
include = ["bin/*", "lib/*"]

[tool.isort]
known_first_party = ["bin", "lib", "tests"]
line_length = 120
profile = "black"
py_version = {{ py_minor|replace('.', '') }}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
coverage = "^7.16.2"
deptry = "^0.25.1"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.17.0"
ruff = "^0.17.1"
sort-all = "^1.3.0"
toml-sort = "^0.25.0"

[tool.pyright]
exclude = [
  "**/__pycache__",
]
include = [
  "bin",
  "lib",
  "tests",
]
pythonPlatform = "All"
pythonVersion = "{{ py_minor }}"
reportConstantRedefinition = "none"
reportMissingTypeStubs = "none"
reportPrivateUsage = "information"
reportPropertyTypeMismatch = "warning"
reportUninitializedInstanceVariable = "warning"
reportUnknownMemberType = "none"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUntypedFunctionDecorator = "warning"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = '.'

[tool.pytest.ini_options]
log_cli = true
log_level = "WARNING"
pythonpath = "."

[tool.ruff]
target-version = "py{{ py_minor|replace('.', '') }}"

[tool.ruff.lint]
extend-select = [
  "I", # isort
  "UP", # pyupgrade
]
ignore = [
  "F403", # 'from modle import *' used; unable to detect undefined names
  "F405", # 'from module import *' used; unable to detect undefined names
  "PLR0402", # `import a.b as b` is the import style here
  "TRY004", # pydantic validators must raise ValueError to produce a ValidationError
]

[tool.tomlsort]
all = true
ignore_case = true
in_place = true
trailing_comma_inline_array = true
